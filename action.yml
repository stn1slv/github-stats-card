name: 'GitHub Stats Cards'
description: 'Generate beautiful GitHub stats cards as SVG images'
author: 'stn1slv'

branding:
  icon: 'bar-chart-2'
  color: 'blue'

inputs:
  card-type:
    description: 'Type of card to generate (user-stats, top-langs, or contrib). "stats" is accepted as an alias for "user-stats".'
    required: true
    default: 'user-stats'
  
  username:
    description: 'GitHub username'
    required: true
  
  token:
    description: 'GitHub Personal Access Token (PAT with read:user scope required for user-stats and contrib cards; the default GITHUB_TOKEN cannot access contribution data)'
    required: true
  
  output:
    description: 'Output SVG file path'
    required: true
  
  theme:
    description: 'Theme name (default, dark, vue-dark, etc.)'
    required: false
    default: 'default'
  
  # Stats card specific options
  show-icons:
    description: 'Show icons next to stats (user-stats card only)'
    required: false
    default: 'false'
  
  hide-border:
    description: 'Hide card border'
    required: false
    default: 'false'
  
  hide-title:
    description: 'Hide card title'
    required: false
    default: 'false'
  
  hide-rank:
    description: 'Hide rank circle (user-stats card only)'
    required: false
    default: 'false'

  rank-icon:
    description: 'Rank circle content: default (letter grade), github (logo above the grade) or percentile - user-stats only'
    required: false
    default: 'default'
  
  include-all-commits:
    description: 'Include all commits, not just current year (user-stats card only)'
    required: false
    default: 'false'
  
  hide:
    description: 'Comma-separated stats/languages to hide'
    required: false
    default: ''

  show:
    description: 'Comma-separated optional stats to add - user-stats only (repos, reviews, prs_merged, prs_merged_percentage, discussions_started, discussions_answered)'
    required: false
    default: ''

  custom-title:
    description: 'Custom card title'
    required: false
    default: ''
  
  # Top-langs specific options
  layout:
    description: 'Layout style (normal, compact, donut, donut-vertical, pie) - top-langs only'
    required: false
    default: 'normal'
  
  langs-count:
    description: 'Number of languages to show (top-langs only)'
    required: false
    default: '5'
  
  limit:
    description: 'Number of repositories to show (contrib only)'
    required: false
    default: '10'
  
  hide-progress:
    description: 'Hide progress bars (top-langs only)'
    required: false
    default: 'false'
  
  weighting:
    description: 'Weighting preset (size-only, balanced, expertise, diversity) - top-langs only'
    required: false
    default: ''
  
  exclude-repo:
    description: 'Comma-separated repos to exclude (top-langs only)'
    required: false
    default: ''
  
  contrib-types:
    description: 'Comma-separated list of contribution types to fetch (commits,prs,issues,reviews) - contrib only'
    required: false
    default: 'commits,prs'
  
  # Color customization
  title-color:
    description: 'Custom title color (hex without #)'
    required: false
    default: ''
  
  text-color:
    description: 'Custom text color (hex without #)'
    required: false
    default: ''
  
  bg-color:
    description: 'Custom background color or gradient'
    required: false
    default: ''
  
  border-color:
    description: 'Custom border color (hex without #)'
    required: false
    default: ''
  
  # Other options
  card-width:
    description: 'Card width in pixels'
    required: false
    default: ''
  
  border-radius:
    description: 'Border radius'
    required: false
    default: '4.5'
  
  disable-animations:
    description: 'Disable CSS animations'
    required: false
    default: 'false'

outputs:
  svg-path:
    description: 'Path to the generated SVG file'
    value: ${{ steps.generate.outputs.svg-path }}

runs:
  using: 'composite'
  steps:
    - name: Checkout action repository
      uses: actions/checkout@v4
      with:
        # Check out the same repository and ref the caller resolved this action
        # from. Hardcoding either one is wrong: without `ref` the checkout takes
        # the default branch, so `uses: ...@v1.1.9` would run whatever is on main
        # and no release would be reproducible; without `repository` a fork
        # consumer (`uses: myfork/github-stats-cards@my-tag`) would look for its
        # own tag in the upstream repository and fail.
        # Both context values are empty when the action runs from a local path
        # (`uses: ./`), where checkout then defaults to the caller's own
        # repository at its current commit, which is what that case wants.
        repository: ${{ github.action_repository }}
        ref: ${{ github.action_ref }}
        path: .github-stats-card-action
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install uv
      shell: bash
      run: pip install uv
    
    - name: Install github-stats-card
      shell: bash
      run: |
        cd .github-stats-card-action
        uv pip install --system -e .
    
    - name: Generate card
      id: generate
      shell: bash
      env:
        # Every input reaches the script as an environment variable. Nothing is
        # interpolated into a string that a shell re-parses, so no input value
        # can inject shell syntax, whatever a caller wires it to.
        CARD_TYPE: ${{ inputs.card-type }}
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ inputs.token }}
        OUTPUT: ${{ inputs.output }}
        THEME: ${{ inputs.theme }}
        HIDE_BORDER: ${{ inputs.hide-border }}
        HIDE_TITLE: ${{ inputs.hide-title }}
        DISABLE_ANIMATIONS: ${{ inputs.disable-animations }}
        SHOW_ICONS: ${{ inputs.show-icons }}
        HIDE_RANK: ${{ inputs.hide-rank }}
        RANK_ICON: ${{ inputs.rank-icon }}
        INCLUDE_ALL_COMMITS: ${{ inputs.include-all-commits }}
        SHOW: ${{ inputs.show }}
        LAYOUT: ${{ inputs.layout }}
        LANGS_COUNT: ${{ inputs.langs-count }}
        HIDE_PROGRESS: ${{ inputs.hide-progress }}
        WEIGHTING: ${{ inputs.weighting }}
        EXCLUDE_REPO: ${{ inputs.exclude-repo }}
        LIMIT: ${{ inputs.limit }}
        CONTRIB_TYPES: ${{ inputs.contrib-types }}
        HIDE: ${{ inputs.hide }}
        CUSTOM_TITLE: ${{ inputs.custom-title }}
        TITLE_COLOR: ${{ inputs.title-color }}
        TEXT_COLOR: ${{ inputs.text-color }}
        BG_COLOR: ${{ inputs.bg-color }}
        BORDER_COLOR: ${{ inputs.border-color }}
        CARD_WIDTH: ${{ inputs.card-width }}
        BORDER_RADIUS: ${{ inputs.border-radius }}
      run: |
        # Arguments are collected in an array and passed straight to the CLI.
        # There is no command string and no eval, so quoting in a value is data,
        # never syntax.
        if [ "$CARD_TYPE" = "user-stats" ] || [ "$CARD_TYPE" = "stats" ]; then
          SUBCOMMAND="user-stats"
        elif [ "$CARD_TYPE" = "top-langs" ]; then
          SUBCOMMAND="top-langs"
        else
          SUBCOMMAND="contrib"
        fi

        # Common options. Optional values are only appended when non-empty, so an
        # explicitly empty input falls back to the CLI's own default instead of
        # being passed through as "".
        ARGS=("$SUBCOMMAND" -u "$USERNAME" -t "$TOKEN" -o "$OUTPUT")
        [ -n "$THEME" ] && ARGS+=(--theme "$THEME")

        # Flags
        [ "$HIDE_BORDER" = "true" ] && ARGS+=(--hide-border)
        [ "$HIDE_TITLE" = "true" ] && ARGS+=(--hide-title)
        [ "$DISABLE_ANIMATIONS" = "true" ] && ARGS+=(--disable-animations)

        # Stats-specific options
        if [ "$CARD_TYPE" = "user-stats" ] || [ "$CARD_TYPE" = "stats" ]; then
          [ "$SHOW_ICONS" = "true" ] && ARGS+=(--show-icons)
          [ "$HIDE_RANK" = "true" ] && ARGS+=(--hide-rank)
          [ -n "$RANK_ICON" ] && ARGS+=(--rank-icon "$RANK_ICON")
          [ "$INCLUDE_ALL_COMMITS" = "true" ] && ARGS+=(--include-all-commits)
          [ -n "$SHOW" ] && ARGS+=(--show "$SHOW")
          [ -n "$HIDE" ] && ARGS+=(--hide "$HIDE")
        fi

        # Top-langs specific options
        if [ "$CARD_TYPE" = "top-langs" ]; then
          [ -n "$LAYOUT" ] && ARGS+=(--layout "$LAYOUT")
          [ -n "$LANGS_COUNT" ] && ARGS+=(--langs-count "$LANGS_COUNT")
          [ "$HIDE_PROGRESS" = "true" ] && ARGS+=(--hide-progress)
          [ -n "$WEIGHTING" ] && ARGS+=(--weighting "$WEIGHTING")
          [ -n "$EXCLUDE_REPO" ] && ARGS+=(--exclude-repo "$EXCLUDE_REPO")
          [ -n "$HIDE" ] && ARGS+=(--hide "$HIDE")
        fi

        # Contrib-specific options
        if [ "$CARD_TYPE" = "contrib" ]; then
          [ -n "$LIMIT" ] && ARGS+=(--limit "$LIMIT")
          [ -n "$EXCLUDE_REPO" ] && ARGS+=(--exclude-repo "$EXCLUDE_REPO")
          [ -n "$CONTRIB_TYPES" ] && ARGS+=(--contrib-types "$CONTRIB_TYPES")
        fi

        # Optional parameters common to every card type. `--hide` is NOT here: the
        # contrib command has no such option, so passing it would abort the run.
        [ -n "$CUSTOM_TITLE" ] && ARGS+=(--custom-title "$CUSTOM_TITLE")
        [ -n "$TITLE_COLOR" ] && ARGS+=(--title-color "$TITLE_COLOR")
        [ -n "$TEXT_COLOR" ] && ARGS+=(--text-color "$TEXT_COLOR")
        [ -n "$BG_COLOR" ] && ARGS+=(--bg-color "$BG_COLOR")
        [ -n "$BORDER_COLOR" ] && ARGS+=(--border-color "$BORDER_COLOR")
        [ -n "$CARD_WIDTH" ] && ARGS+=(--card-width "$CARD_WIDTH")
        [ -n "$BORDER_RADIUS" ] && ARGS+=(--border-radius "$BORDER_RADIUS")

        # Execute (the token is never echoed)
        echo "Running: github-stats-card $SUBCOMMAND -u $USERNAME -o $OUTPUT ..."
        github-stats-card "${ARGS[@]}"

        # Set output using the heredoc form with a randomised delimiter, so neither
        # a newline nor a guessed delimiter in the value can inject extra outputs.
        # printf rather than echo: a value of exactly "-n", "-e" or "-E" would be
        # swallowed by the echo builtin as a flag.
        OUTPUT_DELIM="GSC_EOF_${RANDOM}${RANDOM}${RANDOM}"
        {
          printf '%s\n' "svg-path<<$OUTPUT_DELIM"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT_DELIM"
        } >> "$GITHUB_OUTPUT"
